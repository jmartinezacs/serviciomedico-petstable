async function onClick(e) {
  const t = e.target.closest('[data-tab]');
  if (t) { history.replaceState(null, '', `#/inventario?tab=${t.dataset.tab}`); showTab(t.dataset.tab); return; }
  const i = e.target.closest('[data-i]');
  if (i) {
    if (i.dataset.i === 'exportar-reabasto') { exportarReabasto(); return; }
    if (i.dataset.i === 'reabasto-retry') { renderReabasto(); return; }
    if (i.dataset.i === 'nuevo-med' && await openMedicamentoForm()) refresh();
    if (i.dataset.i === 'entrada' && await openEntrada()) refresh();
    if (i.dataset.i === 'salida' && await openSalida()) refresh();
    return;
  }
  const ia = e.target.closest('[data-ia]');
  if (ia) {
    const m = tStock.row(ia.dataset.id);
    if (!m) return;
    try {
      switch (ia.dataset.ia) {
        case 'entrada': if (await openEntrada(m.id)) refresh(); break;
        case 'editar': if (await openMedicamentoForm(m)) refresh(); break;
        case 'lotes':
          root.querySelector('#l-q').value = m.clave; root.querySelector('#l-exist').value = '';
          await showTab('lotes'); break;
        case 'toggle': {
          const ok = await confirmDialog({ title: m.activo ? 'Desactivar medicamento' : 'Activar medicamento', danger: m.activo,
            message: m.activo ? `${m.nombre} no se podrá registrar en entradas ni dispensar. Su historial se conserva.` : `${m.nombre} volverá a estar disponible.`,
            confirmText: m.activo ? 'Desactivar' : 'Activar' });
          if (!ok) return;
          must(await sb.from('medicamentos_med').update({ activo: !m.activo }).eq('id', m.id).select('id').single());
          toast('Medicamento actualizado.', 'success'); refresh(); break;
        }
        case 'eliminar': {
          const ok = await confirmDialog({ title: 'Eliminar medicamento', danger: true, confirmText: 'Eliminar',
            message: `¿Eliminar ${m.nombre} del catálogo? Solo es posible si nunca tuvo lotes ni movimientos; de lo contrario, desactívalo.` });
          if (!ok) return;
          const { error, count } = await sb.from('medicamentos_med').delete({ count: 'exact' }).eq('id', m.id);
          if (error) throw error;
          if (!count) throw new Error('No se pudo eliminar el registro.');
          toast('Medicamento eliminado.', 'success'); refresh(); break;
        }
        default: break;
      }
    } catch (err) { toast(errMsg(err), 'error'); }
    return;
  }
  const la = e.target.closest('[data-la]');
  if (la) {
    const l = tLotes.row(la.dataset.id);
    if (!l) return;
    if (la.dataset.la === 'uso' && await openUso(l)) refresh();
    if (la.dataset.la === 'salida' && await openSalida(l)) refresh();
    if (la.dataset.la === 'editar' && await openEditarLote(l)) refresh();
    if (la.dataset.la === 'ajuste' && await openAjuste(l)) refresh();
    if (la.dataset.la === 'historial') {
      root.querySelector('#m-q').value = l.lote;
      await showTab('movs');
    }
  }
}

function refresh() {
  if (tab === 'stock') tStock?.load();
  if (tab === 'lotes') tLotes?.load();
  if (tab === 'movs') tMovs?.load();
  if (tab === 'reabasto') renderReabasto();
}

// ---------- Formularios ----------
// Alta / edición de artículo. El inventario siempre se lleva en una sola unidad (tableta, cápsula,
// pieza…), salvo los artículos "por envase" (gel, crema, frasco gotero…). La clave se genera sola.
const PREFIJO = { medicamento: 'MED', insumo: 'INS', equipo: 'EQ' };
async function openMedicamentoForm(m = null) {
  const manana = addDays(todayISO(), 1);
  let claves = [];
  if (!m) {
    try { claves = must(await sb.from('medicamentos_med').select('clave')).data.map((x) => x.clave); } catch { claves = []; }
  }
  const siguiente = (cat) => {
    const p = PREFIJO[cat] || 'MED';
    const n = Math.max(0, ...claves.map((c) => (new RegExp(`^${p}-(\\d+)$`).exec(c) || [])[1]).filter(Boolean).map(Number));
    return `${p}-${String(n + 1).padStart(3, '0')}`;
  };
  const ctrl0 = m?.control === 'envase' ? 'envase' : 'pieza';
  let cap = null;
  return openModal({
    title: m ? 'Editar artículo' : 'Nuevo artículo', submitText: m ? 'Guardar cambios' : 'Registrar', size: 'lg',
    body: `
      <div class="form-grid">
        <div class="field"><label for="md-cat">Categoría <span class="req">*</span></label>
          <select id="md-cat" name="categoria" required>${Object.entries(CATEGORIAS).map(([k, v]) => `<option value="${k}" ${(m?.categoria || 'medicamento') === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <small class="hint">El equipo no se entrega en consultas ni genera alertas.</small></div>
        <div class="field"><label>Clave</label>
          <div class="clave-auto mono" id="md-clave">${esc(m?.clave || siguiente('medicamento'))}</div>
          <small class="hint">${m ? 'La clave no se modifica.' : 'Se asigna automáticamente.'}</small></div>
        <div class="field full"><label for="md-nombre">Nombre y concentración <span class="req">*</span></label>
          <input id="md-nombre" name="nombre" required minlength="2" maxlength="120" value="${esc(m?.nombre || '')}" placeholder="Ej. Paracetamol 500 mg"></div>
      </div>
      <div class="field"><label>¿Cómo se lleva su inventario? <span class="req">*</span></label>
        <div class="modo-inv" role="radiogroup" aria-label="Cómo se lleva su inventario">
          <label class="modo-opt"><input type="radio" name="control" value="pieza" ${ctrl0 === 'pieza' ? 'checked' : ''}>
            <span class="modo-card"><span class="modo-ico uni">${icon('pill')}</span>
              <span class="modo-txt"><b>Por unidad</b><small>Se cuentan una por una: tabletas, cápsulas, ampolletas o piezas.</small><em>Ej. 28 tabletas</em></span>
              <span class="modo-check">${icon('check')}</span></span></label>
          <label class="modo-opt"><input type="radio" name="control" value="envase" ${ctrl0 === 'envase' ? 'checked' : ''}>
            <span class="modo-card"><span class="modo-ico env">${icon('droplets')}</span>
              <span class="modo-txt"><b>Por envase</b><small>Geles, cremas, frascos gotero, aerosoles o rollos: se registra cuánto queda del envase abierto.</small><em>Ej. 2 tubos · uno a la mitad</em></span>
              <span class="modo-check">${icon('check')}</span></span></label>
        </div></div>
      <div class="form-grid">
        <div class="field" id="md-unidad-f"><label for="md-unidad">Se cuenta en <span class="req">*</span></label>
          <input id="md-unidad" name="unidad" maxlength="30" list="md-unidades" value="${esc(mayus(ctrl0 === 'pieza' ? (m?.unidad || 'tableta') : 'tableta'))}">
          <datalist id="md-unidades">${UNIDADES.map((u) => `<option value="${u}">`).join('')}</datalist>
          <small class="hint">Lo que se entrega: tableta, cápsula, pieza…</small></div>
        <div class="field"><label for="md-empaque">Presentación (envase) <span class="req">*</span></label>
          <input id="md-empaque" name="empaque" required maxlength="30" list="md-empaques" value="${esc(mayus(m?.empaque || 'caja'))}">
          <datalist id="md-empaques">${EMPAQUES.map((u) => `<option value="${u}">`).join('')}</datalist>
          <small class="hint">En qué viene: caja, frasco, bote, tubo…</small></div>
        <div class="field"><label for="md-min" id="md-min-l">Stock mínimo <span class="req">*</span></label>
          <input id="md-min" name="stock_minimo" type="number" inputmode="numeric" min="0" max="1000000" step="1" required value="${esc(m?.stock_minimo ?? 0)}">
          <small class="hint" id="md-min-hint"></small></div>
        <div class="field"><label for="md-pres">Descripción (opcional)</label>
          <input id="md-pres" name="presentacion" maxlength="120" value="${esc(m?.presentacion || '')}" placeholder="Ej. Blíster de 10 tabletas"></div>
      </div>
      ${m ? `<p class="hint">Para cambiar la existencia usa Registrar entrada, Registrar salida o Ajuste por conteo físico.</p>` : `
      <fieldset><legend>Existencia inicial (opcional)</legend>
        <div class="form-grid">
          <div class="field"><label for="md-lote">Lote <span class="req" data-medreq>*</span></label>
            <input id="md-lote" name="lote" maxlength="40" autocomplete="off" placeholder="Número de lote del fabricante"></div>
          <div class="field"><label for="md-cad">Caducidad <span class="req" data-medreq>*</span></label>
            <input id="md-cad" name="caducidad" type="date" min="${manana}"></div>
          <div class="field full"><label>Capturar cantidad</label><div id="md-modo-wrap"></div></div>
          <div class="field"><label for="md-cant">Cantidad</label>
            <input id="md-cant" name="cantidad" type="number" inputmode="numeric" min="1" max="100000" step="1">
            <small class="hint" data-total="cantidad"></small></div>
        </div>
        <small class="hint">Si la dejas vacía, registra la existencia después con Registrar entrada.</small>
      </fieldset>`}`,
    onOpen: ({ form }) => {
      const datos = () => {
        const env = form.elements.control.value === 'envase';
        const empaque = form.elements.empaque.value.trim().toLowerCase() || 'envase';
        const unidad = env ? empaque : (form.elements.unidad.value.trim().toLowerCase() || 'unidad');
        return { control: env ? 'envase' : 'pieza', unidad, empaque, contenido_empaque: m?.contenido_empaque || 1, categoria: form.elements.categoria.value };
      };
      let firma = '';
      const upd = () => {
        const d = datos();
        form.querySelector('#md-unidad-f').classList.toggle('hidden', d.control === 'envase');
        form.elements.unidad.required = d.control !== 'envase';
        if (!m) form.querySelector('#md-clave').textContent = siguiente(d.categoria);
        form.querySelector('#md-min-l').innerHTML = `Stock mínimo (${esc(plural(d.unidad, 2))}) <span class="req">*</span>`;
        const min = Number(form.elements.stock_minimo.value) || 0;
        form.querySelector('#md-min-hint').textContent = d.categoria === 'equipo' ? 'El equipo no genera alertas.' : min ? `Alerta cuando haya menos de ${cantUnidad(min, d.unidad)}.` : 'Sin alerta de stock mínimo.';
        if (m) return;
        form.querySelectorAll('[data-medreq]').forEach((x) => { x.hidden = d.categoria !== 'medicamento'; });
        // La captura (por unidad o por envase) se redibuja si cambia la unidad o la presentación
        const f = `${d.control}|${d.unidad}|${d.empaque}`;
        if (f !== firma) {
          firma = f;
          form.querySelector('#md-modo-wrap').innerHTML = capturaHTML('md-modo', d);
          if (!cap) cap = bindCaptura(form, 'md-modo', 'cantidad', datos); else cap.reset();
        } else cap?.paint();
      };
      form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
    },
    onSubmit: async ({ form, setError }) => {
      if (!checkForm(form)) return false;
      const v = formValues(form);
      const env = v.control === 'envase';
      const payload = {
        nombre: v.nombre, categoria: v.categoria, control: v.control, empaque: v.empaque,
        unidad: env ? v.empaque : v.unidad, presentacion: nullIfEmpty(v.presentacion), stock_minimo: Number(v.stock_minimo),
      };
      if (m) {
        must(await sb.from('medicamentos_med').update(payload).eq('id', m.id).select('id').single());
        toast('Artículo actualizado.', 'success');
        return true;
      }
      // Existencia inicial opcional
      const total = v.cantidad ? cap.total() : 0;
      if (v.cantidad) {
        if (!total) { setError('Indica cuántas unidades trae cada envase.'); return false; }
        if (v.categoria === 'medicamento' && (!v.lote || !v.caducidad)) { setError('Para registrar la existencia de un medicamento indica lote y caducidad.'); return false; }
        if (v.caducidad && v.caducidad < manana) { setError('La caducidad debe ser posterior a hoy.'); return false; }
      }
      if (cap?.modo() === 'empaque') payload.contenido_empaque = cap.contenido();
      const { data } = must(await sb.from('medicamentos_med').insert(payload).select('id, clave').single());
      if (total) {
        const { error } = await sb.rpc('med_registrar_entrada', { p_medicamento: data.id, p_lote: v.lote, p_caducidad: v.caducidad || null, p_cantidad: total, p_motivo: 'Existencia inicial' });
        if (error) { toast(`Artículo ${data.clave} registrado, pero no se pudo registrar la existencia: ${errMsg(error)}`, 'warning', 8000); return true; }
      }
      toast(`Artículo ${data.clave} registrado${total ? ` con ${cantUnidad(total, payload.unidad)}` : ''}.`, 'success', 6000);
      return true;
    },
  });
}

async function openEntrada(medId = null) {
  let meds;
  try {
    meds = must(await sb.from('medicamentos_med').select('id, clave, nombre, unidad, empaque, contenido_empaque, categoria, control').eq('activo', true).order('nombre')).data;
  } catch (err) { toast(errMsg(err), 'error'); return false; }
  if (!meds.length) { toast('Primero registra un artículo activo en el catálogo.', 'warning'); return false; }
  const manana = addDays(todayISO(), 1);
  let lotes = [], cap = null;
  const medSel = (form) => meds.find((x) => x.id === form.elements.medicamento.value) || null;
  return openModal({
    title: 'Registrar entrada', subtitle: 'Ingresa existencias por lote. Si el lote ya existe, se suma a su existencia.',
    submitText: 'Registrar entrada', size: 'lg',
    body: `
      <div class="form-grid">
        <div class="field full"><label for="en-med">Artículo <span class="req">*</span></label>
          <select id="en-med" name="medicamento" required><option value="">Selecciona…</option>
            ${meds.map((m) => `<option value="${esc(m.id)}" ${m.id === medId ? 'selected' : ''}>${esc(m.nombre)} · ${esc(m.clave)}</option>`).join('')}</select></div>
        <div class="field"><label for="en-lote">Lote <span class="req" id="en-lote-req">*</span></label>
          <input id="en-lote" name="lote" required maxlength="40" autocomplete="off" list="en-lotes" placeholder="Número de lote del fabricante">
          <datalist id="en-lotes"></datalist>
          <small class="hint" id="en-lote-hint"></small></div>
        <div class="field"><label for="en-cad">Caducidad <span class="req" id="en-cad-req">*</span></label>
          <input id="en-cad" name="caducidad" type="date" required min="${manana}">
          <small class="hint" id="en-cad-hint"></small></div>
        <div class="field full"><label>Capturar cantidad</label><div id="en-modo-wrap"><span class="hint">Selecciona un artículo.</span></div></div>
        <div class="field"><label for="en-cant">Cantidad <span class="req">*</span></label>
          <input id="en-cant" name="cantidad" type="number" inputmode="numeric" min="1" max="100000" step="1" required>
          <small class="hint" data-total="cantidad"></small></div>
      </div>`,
    onOpen: ({ form }) => {
      const sel = form.elements.medicamento, lote = form.elements.lote, cad = form.elements.caducidad;
      const hint = form.querySelector('#en-lote-hint');
      const setModo = () => {
        const m = medSel(form);
        const esMed = !m || m.categoria === 'medicamento';
        // Insumos y equipo: lote y caducidad opcionales
        lote.required = esMed; cad.required = esMed;
        form.querySelector('#en-lote-req').hidden = !esMed;
        form.querySelector('#en-cad-req').hidden = !esMed;
        lote.placeholder = esMed ? 'Número de lote del fabricante' : 'Opcional (si no tiene, se registra S/N)';
        form.querySelector('#en-cad-hint').textContent = esMed ? '' : 'Opcional: déjala vacía si no caduca.';
        form.querySelector('#en-modo-wrap').innerHTML = capturaHTML('en-modo', m);
        if (!cap) cap = bindCaptura(form, 'en-modo', 'cantidad', () => medSel(form));
        else cap.reset();
      };
      const loadLotes = async () => {
        setModo();
        lotes = [];
        form.querySelector('#en-lotes').innerHTML = '';
        if (!sel.value) return;
        const { data } = await sb.from('lotes_med').select('lote, caducidad').eq('medicamento_id', sel.value).order('caducidad', { ascending: false }).limit(50);
        lotes = data || [];
        form.querySelector('#en-lotes').innerHTML = lotes.map((l) => `<option value="${esc(l.lote)}">${l.caducidad ? `Cad. ${fmtDate(l.caducidad)}` : 'Sin caducidad'}</option>`).join('');
        checkLote();
      };
      const checkLote = () => {
        const ex = lotes.find((l) => l.lote.toLowerCase() === lote.value.trim().toLowerCase());
        if (ex) { cad.value = ex.caducidad || ''; cad.readOnly = true; hint.textContent = `Lote existente (${ex.caducidad ? `cad. ${fmtDate(ex.caducidad)}` : 'sin caducidad'}): la cantidad se sumará.`; }
        else { if (cad.readOnly) cad.value = ''; cad.readOnly = false; hint.textContent = ''; }
      };
      sel.addEventListener('change', loadLotes);
      lote.addEventListener('input', checkLote);
      loadLotes();
    },
    onSubmit: async ({ form, setError }) => {
      if (!checkForm(form, { caducidad: (v) => (v && v < manana && !form.elements.caducidad.readOnly ? 'La caducidad debe ser posterior a hoy.' : '') })) return false;
      const v = formValues(form);
      const m = medSel(form);
      const total = cap.total();
      if (!total) { setError('Indica cuántas unidades trae cada empaque.'); return false; }
      if (total > 100000) { setError(`El total (${cantUnidad(total, m.unidad)}) excede el máximo de 100,000 por movimiento.`); return false; }
      const lote = await sb.rpc('med_registrar_entrada', {
        p_medicamento: v.medicamento, p_lote: v.lote, p_caducidad: v.caducidad || null, p_cantidad: total, p_motivo: null,
      });
      must(lote);
      // Se recuerda el contenido por empaque capturado para la próxima vez
      if (cap.modo() === 'empaque' && cap.contenido() !== Number(m.contenido_empaque)) {
        await sb.from('medicamentos_med').update({ contenido_empaque: cap.contenido() }).eq('id', m.id);
      }
      const det = cap.modo() === 'empaque' ? ` (${fmtNum(Number(v.cantidad))} ${plural(m.empaque, Number(v.cantidad))} de ${fmtNum(cap.contenido())})` : '';
      toast(`Entrada registrada: ${cantUnidad(total, m.unidad)}${det}.`, 'success', 6000);
    },
  });
}

const MOTIVOS_SALIDA = ['Merma o daño', 'Caducado / destrucción', 'Entrega sin cita', 'Devolución a proveedor', 'Otro'];
// Salida: si no se recibe el lote, se elige artículo y lote en el mismo formulario
async function openSalida(l0 = null) {
  let lotes = l0 ? [l0] : null;
  if (!lotes) {
    try {
      lotes = must(await sb.from('v_lotes_med').select('*').gt('existencia', 0).order('medicamento').order('caducidad', { nullsFirst: false })).data;
    } catch (err) { toast(errMsg(err), 'error'); return false; }
    if (!lotes.length) { toast('No hay lotes con existencia para registrar una salida.', 'warning'); return false; }
  }
  const meds = [...new Map(lotes.map((l) => [l.medicamento_id, l.medicamento])).entries()];
  let cap = null;
  const loteSel = (form) => (l0 || lotes.find((l) => l.id === form.elements.lote.value) || null);
  const loteTxt = (l) => `${l.lote} · ${l.caducidad ? `cad. ${fmtDate(l.caducidad)}` : 'sin caducidad'} · ${cantUnidad(l.existencia, l.unidad)} disponibles${l.estado_caducidad === 'caducado' ? ' · CADUCADO' : ''}`;
  return openModal({
    title: 'Registrar salida', subtitle: l0 ? `${l0.medicamento} · Lote ${l0.lote}` : 'Elige el artículo, el lote y la cantidad que sale.',
    submitText: 'Registrar salida', danger: true,
    body: `
      ${l0 ? '' : `<div class="form-grid">
        <div class="field"><label for="sa-med">Artículo <span class="req">*</span></label>
          <select id="sa-med" name="med" required><option value="">Selecciona…</option>
            ${meds.map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('')}</select></div>
        <div class="field"><label for="sa-lote">Lote <span class="req">*</span></label>
          <select id="sa-lote" name="lote" required disabled><option value="">—</option></select>
          <small class="hint">Se propone primero el lote que caduca antes.</small></div>
      </div>`}
      <div class="notice" id="sa-disp" ${l0 ? '' : 'hidden'}>${l0 ? `${icon('package')}<span>Disponible: <b>${esc(loteTxt(l0))}</b></span>` : ''}</div>
      <div class="notice warn" id="sa-cad" ${l0?.estado_caducidad === 'caducado' ? '' : 'hidden'}>${icon('alert-triangle')}<span>Este lote está caducado. Regístralo como “Caducado / destrucción”.</span></div>
      <div class="field"><label>Capturar cantidad</label><div id="sa-modo-wrap">${capturaHTML('sa-modo', l0)}</div></div>
      <div class="form-grid">
        <div class="field"><label for="sa-cant">Cantidad <span class="req">*</span></label>
          <input id="sa-cant" name="cantidad" type="number" inputmode="numeric" min="1" step="1" required>
          <small class="hint" data-total="cantidad"></small></div>
        <div class="field"><label for="sa-tipo">Motivo <span class="req">*</span></label>
          <select id="sa-tipo" name="tipo" required><option value="">Selecciona…</option>
            ${MOTIVOS_SALIDA.map((m) => `<option ${l0?.estado_caducidad === 'caducado' && m.startsWith('Caducado') ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
        <div class="field full"><label for="sa-det">Detalle</label>
          <textarea id="sa-det" name="detalle" maxlength="250" data-counter placeholder="Describe brevemente la salida"></textarea></div>
      </div>`,
    onOpen: ({ form }) => {
      bindCounters(form);
      cap = bindCaptura(form, 'sa-modo', 'cantidad', () => loteSel(form), () => loteSel(form)?.existencia ?? null);
      if (l0) return;
      const pintaLote = () => {
        const l = loteSel(form);
        const disp = form.querySelector('#sa-disp');
        disp.hidden = !l;
        disp.innerHTML = l ? `${icon('package')}<span>Disponible: <b>${esc(loteTxt(l))}</b></span>` : '';
        form.querySelector('#sa-cad').hidden = l?.estado_caducidad !== 'caducado';
        if (l?.estado_caducidad === 'caducado') form.elements.tipo.value = 'Caducado / destrucción';
        form.querySelector('#sa-modo-wrap').innerHTML = capturaHTML('sa-modo', l);
        cap.reset(); refreshIcons();
      };
      form.elements.med.addEventListener('change', () => {
        const ls = lotes.filter((l) => l.medicamento_id === form.elements.med.value);
        form.elements.lote.innerHTML = ls.map((l) => `<option value="${esc(l.id)}">${esc(loteTxt(l))}</option>`).join('') || '<option value="">—</option>';
        form.elements.lote.disabled = !ls.length;
        pintaLote();
      });
      form.elements.lote.addEventListener('change', pintaLote);
    },
    onSubmit: async ({ form, setError }) => {
      if (!checkForm(form, { detalle: (v, f) => (f.tipo.value === 'Otro' && !v ? 'Describe el motivo de la salida.' : '') })) return false;
      const v = formValues(form);
      const l = loteSel(form);
      const total = cap.total();
      if (!total) { setError('Indica cuántas unidades trae cada empaque.'); return false; }
      if (total > l.existencia) { setError(`Solo hay ${cantUnidad(l.existencia, l.unidad)} en este lote.`); return false; }
      must(await sb.rpc('med_registrar_salida', { p_lote: l.id, p_cantidad: total, p_motivo: v.detalle ? `${v.tipo}: ${v.detalle}` : v.tipo }));
      toast(`Salida registrada: ${cantUnidad(total, l.unidad)} de ${l.medicamento}.`, 'success');
    },
  });
}

// Uso de un envase (gel, crema, frasco…): se registra cuánto queda; al terminarse se descuenta
function nivelesHTML(name, actual = null) {
  return `<div class="nivel-seg" role="radiogroup" aria-label="Cuánto queda del envase">
    ${[100, 75, 50, 25].map((n) => `<label><input type="radio" name="${name}" value="${n}" required ${actual === n ? 'checked' : ''}><span>${NIVELES[n]}</span></label>`).join('')}
    <label class="fin"><input type="radio" name="${name}" value="0" required><span>Se terminó</span></label></div>`;
}
async function openUso(l) {
  return openModal({
    title: 'Registrar uso del envase', subtitle: `${l.medicamento} · Lote ${l.lote} · ${cantUnidad(l.existencia, l.unidad)}`,
    submitText: 'Registrar uso', size: 'sm',
    body: `
      <div class="notice">${icon('droplet')}<span>${l.nivel ? `El envase abierto tenía: <b>${esc(NIVELES[l.nivel])}</b>.` : 'Aún no hay un envase abierto en este lote.'} Marca cuánto queda después de usarlo. Si se terminó, se descuenta 1 ${esc(l.unidad)} del inventario.</span></div>
      <div class="field"><label>¿Cuánto queda del envase? <span class="req">*</span></label>${nivelesHTML('nivel', l.nivel)}</div>
      <div class="field"><label for="us-det">Detalle</label>
        <input id="us-det" name="detalle" maxlength="250" placeholder="Opcional. Ej. curación en área de producción"></div>`,
    onSubmit: async ({ form, setError }) => {
      const n = form.querySelector('input[name="nivel"]:checked');
      if (!n) { setError('Indica cuánto queda del envase.'); return false; }
      must(await sb.rpc('med_registrar_uso', { p_lote: l.id, p_nivel: Number(n.value), p_motivo: nullIfEmpty(form.elements.detalle.value.trim()) }));
      toast(n.value === '0' ? `Envase terminado: se descontó 1 ${l.unidad}.` : 'Uso registrado.', 'success');
    },
  });
}

// Edición manual del número de lote y la caducidad (no cambia la existencia)
async function openEditarLote(l) {
  const esMed = l.categoria === 'medicamento';
  return openModal({
    title: 'Editar lote', subtitle: `${l.medicamento} · ${cantUnidad(l.existencia, l.unidad)}`, submitText: 'Guardar cambios', size: 'sm',
    body: `
      <div class="field"><label for="el-lote">Número de lote <span class="req">*</span></label>
        <input id="el-lote" name="lote" required maxlength="40" autocomplete="off" value="${esc(l.lote)}"></div>

    must(citasRes); must(ocupRes);
    if (t !== agendaToken) return;
    agendaRows = citasRes.data;
    const diaBloq = bloqueoDe(bloqueos, agendaDate);
    if (diaBloq && !agendaRows.length) {
      body.innerHTML = emptyState({ ico: 'calendar-off', title: `Sin servicio: ${diaBloq.motivo}`,
        text: state.isAdmin ? 'Puedes quitar o cambiar este bloqueo con el botón Días sin servicio.' : 'Este día no hay consulta. Elige otro día o usa Cita de urgencia.' });
      refreshIcons(); return;
    }
    // Las horas libres del médico (p. ej. 10:05) ocupan el bloque en el que caen
    const ocupados = new Set((ocupRes.data || []).map((h) => slotDe(fmtTime(h))));
    const now = nowHHMM();
    const rows = SLOTS.map((slot) => {
      const here = agendaRows.filter((c) => c.tipo !== 'urgente' && slotDe(fmtTime(c.hora)) === slot);
      const pasada = agendaDate < hoy || (agendaDate === hoy && slot <= now);
      const libre = !ocupados.has(slot);
      const bloq = bloqueoDe(bloqueos, agendaDate, slot);
      if (bloq && !here.length) {
        return `<div class="agenda-slot blocked"><span class="hora">${slot}</span>
          <div class="who"><b>Sin servicio</b><span>${esc(bloq.motivo)}</span></div><span></span></div>`;
      }
      const puedeAgendar = libre && (state.isMedico ? agendaDate >= hoy : !pasada);
      const citasHTML = here.map((c) => `
        <div class="agenda-slot ${pasada ? 'past' : ''}">
          <span class="hora">${esc(fmtTime(c.hora))}</span>
          <div class="who"><b>${esc(c.colaborador)} ${estadoPill(c.estado)}</b>
            <span>${esc(c.folio_txt)} · ${esc(MOTIVOS[c.motivo] || c.motivo)} · ${esc(c.area)}${state.isAdmin ? ` · Solicitó ${esc(c.solicitante)}` : ''}</span></div>
          ${actionsHTML(c)}
        </div>`).join('');
      const active = here.some((c) => ['pendiente', 'confirmada', 'atendida'].includes(c.estado));
      if (active) return citasHTML;
      if (!libre) {
        return citasHTML + `<div class="agenda-slot ${pasada ? 'past' : ''}"><span class="hora">${slot}</span>
          <div class="who"><b>Ocupado</b><span>Horario reservado</span></div><span></span></div>`;
      }
      return citasHTML + `<div class="agenda-slot free ${pasada ? 'past' : ''}"><span class="hora">${slot}</span>
        <div class="who">${pasada ? 'Horario transcurrido' : 'Disponible'}</div>
        ${puedeAgendar ? `<button class="btn teal" data-c="agendar" data-hora="${slot}">${icon('plus')} Agendar</button>` : '<span></span>'}</div>`;
    });
    const total = agendaRows.filter((c) => c.estado !== 'no_asistio').length;
    // Urgencias y citas que el médico agendó fuera de los bloques de la agenda
    const urgentes = agendaRows.filter((c) => c.tipo === 'urgente' || !SLOTS.includes(slotDe(fmtTime(c.hora))));
    const urgHTML = urgentes.length ? `<div class="section-title" style="margin-top:0">${icon('siren')} Citas de urgencia / extraordinarias</div>
      <div class="agenda" style="margin-bottom:14px">${urgentes.map((c) => `<div class="agenda-slot urg">
        <span class="hora">${c.hora ? fmtTime(c.hora) : '—'}</span>
        <div class="who"><b>${esc(c.colaborador)} ${estadoPill(c.estado)} ${c.tipo === 'urgente' ? pill('Urgente', 'bad') : ''}</b>
          <span>${esc(c.folio_txt)} · ${esc(c.hora ? 'Horario especial' : 'Horario por asignar')} · ${esc(c.area)}${state.isAdmin ? ` · Solicitó ${esc(c.solicitante)}` : ''}</span></div>
        ${actionsHTML(c)}</div>`).join('')}</div>` : '';
    const bloqHTML = bloqueos.length ? `<div class="notice warn">${icon('calendar-off')}<span><b>Sin servicio:</b> ${bloqueos.map((b) => `${esc(bloqueoTxt(b))} · ${esc(b.motivo)}`).join('; ')}</span></div>` : '';
    body.innerHTML = `${bloqHTML}${urgHTML}<p class="hint" style="margin:0 0 10px">${fmtNum(ocupados.size)} de ${SLOTS.length} horarios ocupados${state.isAdmin ? '' : ` · ${fmtNum(total)} cita(s) tuyas este día`}.</p>
      <div class="agenda">${rows.join('')}</div>`;
    refreshIcons();
  } catch (err) {
    if (t !== agendaToken) return;
    console.error(err);
    body.innerHTML = errorState(err).replace('data-action="retry"', 'data-c="agenda-retry"');
    refreshIcons();
  }
}

// ---------- Agenda semanal ----------
let semanaRows = [], semanaToken = 0;
const lunesDe = (iso) => addDays(iso, 1 - isoDow(iso));
const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie'];

async function renderSemana() {
  const t = ++semanaToken;
  const card = root?.querySelector('#semana-card');
  if (!card) return;
  const hoy = todayISO();
  const lunes = lunesDe(agendaDate);
  const dias = DIAS.map((_, i) => addDays(lunes, i));
  card.innerHTML = `
    <div class="agenda-nav">
      <button class="icon-btn" data-c="semana-prev" aria-label="Semana anterior">${icon('chevron-left')}</button>
      <button class="icon-btn" data-c="semana-next" aria-label="Semana siguiente">${icon('chevron-right')}</button>
      <button class="btn secondary" data-c="semana-hoy">Esta semana</button>
      <span class="agenda-day" style="text-transform:none">Semana del ${esc(fmtDate(dias[0]))} al ${esc(fmtDate(dias[4]))}</span>
    </div>
    <div id="semana-body"><div class="skeleton" style="height:120px"></div></div>`;
  refreshIcons();
  const body = card.querySelector('#semana-body');
  try {
    const [citasRes, bloqueos, ...ocup] = await Promise.all([
      sb.from('v_citas_med').select('id, folio_txt, fecha, hora, colaborador, num_empleado, area, motivo, descripcion, estado, solicitante, solicitado_por, tipo')
        .gte('fecha', dias[0]).lte('fecha', dias[4]).neq('estado', 'cancelada').order('hora'),
      getBloqueos(dias[0], dias[4]),
      ...dias.map((d) => sb.rpc('med_horarios_ocupados', { p_fecha: d })),
    ]);
    must(citasRes); ocup.forEach(must);
    if (t !== semanaToken) return;
    semanaRows = citasRes.data;
    const ocupados = dias.map((_, i) => new Set((ocup[i].data || []).map((h) => slotDe(fmtTime(h)))));
    const especial = (c) => c.tipo === 'urgente' || !SLOTS.includes(slotDe(fmtTime(c.hora)));
    const now = nowHHMM();
    const chip = (c) => `<button type="button" class="wk-chip st-${esc(c.estado)} ${c.tipo === 'urgente' ? 'urg' : ''}" data-act="ver" data-id="${esc(c.id)}" title="${esc(`${c.folio_txt} · ${c.colaborador} · ${ESTADOS[c.estado]?.label || c.estado}`)}">
        ${c.tipo === 'urgente' || (c.hora && !SLOTS.includes(fmtTime(c.hora))) ? `<b>${esc(fmtTime(c.hora))}</b> ` : ''}${esc(c.colaborador)}</button>`;
    const head = dias.map((d, i) => {
      const b = bloqueoDe(bloqueos, d);
      return `<div class="wk-head ${d === hoy ? 'today' : ''}"><button type="button" class="link-btn" data-c="ver-dia" data-fecha="${d}">${DIAS[i]} ${esc(d.slice(8, 10))}/${esc(d.slice(5, 7))}</button>
        ${b ? `<small class="wk-off">${esc(b.motivo)}</small>` : ''}</div>`;
    }).join('');
    const urgentes = dias.map((d) => semanaRows.filter((c) => c.fecha === d && especial(c)));
    const urgRow = urgentes.some((u) => u.length)
      ? `<div class="wk-hora">${icon('siren')}</div>${urgentes.map((u) => `<div class="wk-cell">${u.map(chip).join('')}</div>`).join('')}` : '';
    const filas = SLOTS.map((s) => `<div class="wk-hora mono">${s}</div>${dias.map((d, i) => {
      const here = semanaRows.filter((c) => c.fecha === d && !especial(c) && slotDe(fmtTime(c.hora)) === s);
      if (here.length) return `<div class="wk-cell">${here.map(chip).join('')}</div>`;
      const pasada = d < hoy || (d === hoy && s <= now);
      if (bloqueoDe(bloqueos, d, s)) return '<div class="wk-cell off" title="Sin servicio"></div>';
      if (ocupados[i].has(s)) return '<div class="wk-cell busy"><span>Ocupado</span></div>';
      if (pasada) return '<div class="wk-cell past"></div>';
      return `<div class="wk-cell free"><button type="button" data-c="agendar" data-fecha="${d}" data-hora="${s}" aria-label="Agendar ${DIAS[i]} ${s}">${icon('plus')}</button></div>`;
    }).join('')}`).join('');
    body.innerHTML = `<div class="wk-scroll"><div class="wk-grid"><div class="wk-hora"></div>${head}${urgRow}${filas}</div></div>
      <p class="hint" style="margin:10px 0 0">Toca una cita para ver el detalle o un espacio libre (+) para agendar. ${state.isAdmin ? '' : 'Solo ves el nombre de las citas que tú solicitaste.'}</p>`;
    refreshIcons();
  } catch (err) {
    if (t !== semanaToken) return;
    console.error(err);
    body.innerHTML = errorState(err).replace('data-action="retry"', 'data-c="semana-retry"');
    refreshIcons();
  }
}

// ---------- Días u horarios sin servicio (solo Servicio Médico) ----------
async function openBloqueos() {
  const hoy = todayISO();
  const lista = async (cont) => {
    cont.innerHTML = '<div class="skeleton" style="height:60px"></div>';
    try {
      const rows = await getBloqueos(hoy, addDays(hoy, 730));
      cont.innerHTML = rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Horario</th><th>Motivo</th><th class="actions"></th></tr></thead><tbody>
        ${rows.map((b) => `<tr><td>${esc(fmtDate(b.fecha))}<div class="cell-sub">${esc(fmtLongDate(b.fecha).split(',')[0])}</div></td>
          <td>${esc(bloqueoTxt(b))}</td><td>${esc(b.motivo)} ${b.tipo === 'festivo' ? pill('Festivo', 'info') : ''}</td>
          <td class="actions"><button type="button" class="icon-btn bad" data-del="${esc(b.id)}" title="Quitar" aria-label="Quitar">${icon('trash-2')}</button></td></tr>`).join('')}
        </tbody></table></div>` : '<p class="hint">No hay días sin servicio próximos.</p>';
      refreshIcons();
    } catch (err) { cont.innerHTML = `<p class="hint" style="color:var(--bad)">${esc(errMsg(err))}</p>`; }
  };
  return openModal({
    title: 'Días sin servicio', size: 'lg', submitText: 'Agregar', confirmDiscard: false,
    subtitle: 'Festivos, vacaciones, cursos o ausencias. Nadie podrá agendar citas normales en esos horarios.',
    body: `
      <div class="form-grid">
        <div class="field"><label for="bq-fecha">Fecha <span class="req">*</span></label>
          <input id="bq-fecha" name="fecha" type="date" required min="${hoy}"></div>
        <div class="field"><label for="bq-hasta">Hasta (opcional, varios días)</label>
          <input id="bq-hasta" name="hasta" type="date" min="${hoy}"></div>
      </div>
      <label class="switch-row" for="bq-todo"><span><b>Todo el día</b></span><input type="checkbox" id="bq-todo" name="todo" checked></label>
      <div class="form-grid hidden" id="bq-horas">
        <div class="field"><label for="bq-ini">Desde</label><select id="bq-ini" name="ini">${SLOTS.map((s) => `<option>${s}</option>`).join('')}</select></div>
        <div class="field"><label for="bq-fin">Hasta</label><select id="bq-fin" name="fin">${[...SLOTS.slice(1), '17:20'].map((s) => `<option ${s === '17:20' ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="form-grid">
        <div class="field"><label for="bq-tipo">Tipo</label><select id="bq-tipo" name="tipo">
          <option value="ausencia">Ausencia del médico</option><option value="festivo">Día festivo</option><option value="otro">Otro</option></select></div>
        <div class="field"><label for="bq-motivo">Motivo <span class="req">*</span></label>
          <input id="bq-motivo" name="motivo" required maxlength="120" placeholder="Ej. vacaciones, curso, junta"></div>
      </div>
      <div class="notice" id="bq-aviso" hidden></div>
      <div class="section-title">${icon('calendar-off')} Próximos</div>
      <div id="bq-lista"></div>`,
    onOpen: ({ form }) => {
      const cont = form.querySelector('#bq-lista');
      lista(cont);
      form.elements.todo.addEventListener('change', () => form.querySelector('#bq-horas').classList.toggle('hidden', form.elements.todo.checked));
      cont.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-del]'); if (!b) return;
        if (!(await confirmDialog({ title: 'Quitar día sin servicio', message: 'Se podrá volver a agendar en ese horario.', confirmText: 'Quitar', danger: true }))) return;
        const { error } = await sb.from('dias_sin_servicio_med').delete().eq('id', b.dataset.del);
        if (error) toast(errMsg(error), 'error'); else { toast('Día liberado.', 'success'); lista(cont); }
      });
    },
    onSubmit: async ({ form, setError }) => {
      if (!checkForm(form, { hasta: (v, f) => (v && v < f.fecha.value ? 'Debe ser igual o posterior a la fecha inicial.' : '') })) return false;
      const v = formValues(form);
      const todo = !!form.elements.todo.checked;
      if (!todo && v.fin <= v.ini) { setError('La hora final debe ser posterior a la inicial.'); return false; }
      const fechas = [];
      for (let d = v.fecha; d <= (v.hasta || v.fecha) && fechas.length < 120; d = addDays(d, 1)) if (isWeekday(d)) fechas.push(d);
      if (!fechas.length) { setError('El periodo no incluye días hábiles.'); return false; }
      must(await sb.from('dias_sin_servicio_med').insert(fechas.map((f) => ({
        fecha: f, tipo: v.tipo, motivo: v.motivo, hora_inicio: todo ? null : v.ini, hora_fin: todo ? null : v.fin,
      }))));
      // Avisar de citas ya agendadas que quedan dentro del bloqueo (no se cancelan solas)
      const { data } = await sb.from('v_citas_med').select('folio_txt, fecha, hora, colaborador')
        .in('fecha', fechas).in('estado', ['pendiente', 'confirmada']).not('hora', 'is', null);
      const afectadas = (data || []).filter((c) => todo || (fmtTime(c.hora) >= v.ini && fmtTime(c.hora) < v.fin));
      form.reset(); form.querySelector('#bq-horas').classList.add('hidden');
      const aviso = form.querySelector('#bq-aviso');
      aviso.hidden = !afectadas.length;
      aviso.innerHTML = afectadas.length ? `${icon('alert-triangle')}<span><b>${afectadas.length} cita(s) ya agendada(s) en ese periodo:</b> ${afectadas.map((c) => `${esc(c.folio_txt)} ${esc(fmtDate(c.fecha))} ${esc(fmtTime(c.hora))} h (${esc(c.colaborador)})`).join(', ')}. Reprográmalas o cancélalas para avisar a quien las pidió.</span>` : '';
      refreshIcons();
      toast(fechas.length === 1 ? 'Día sin servicio registrado.' : `${fechas.length} días sin servicio registrados.`, 'success');
      lista(form.querySelector('#bq-lista'));
      return false; // el modal sigue abierto para registrar más
    },
  });
}

// ---------- Constancia de atención (imprimible, sin datos clínicos) ----------
async function imprimirConstancia(id) {
  const { data, error } = await sb.rpc('med_constancia', { p_cita: id });
  if (error || !data?.[0]) { toast(error ? errMsg(error) : 'La constancia solo está disponible para citas atendidas.', 'error'); return; }
  const c = data[0];
  const salida = new Intl.DateTimeFormat('es-MX', { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(c.atendido_at));
  document.getElementById('print-area')?.remove();
  const el = document.createElement('div');
  el.id = 'print-area';
  el.innerHTML = `
    <div class="pc-head"><div class="brand-logo pc-logo" role="img" aria-label="Pet's Table"></div>
      <div><h1>Constancia de atención</h1><p>Servicio Médico · Salud laboral · Pet's Table S.A. de C.V.</p></div></div>
    <p class="pc-text">Se hace constar que <b>${esc(c.colaborador)}</b>${c.num_empleado ? `, No. de empleado <b>${esc(c.num_empleado)}</b>` : ''}${c.area ? `, del área de <b>${esc(c.area)}</b>` : ''},
      acudió a Servicio Médico el <b>${esc(fmtLongDate(c.fecha))}</b>.</p>
    <table class="pc-table">
      <tr><th>Folio</th><td>${esc(c.folio_txt)}</td></tr>
      <tr><th>${c.tipo === 'urgente' ? 'Horario asignado (urgencia)' : 'Horario de la cita'}</th><td>${esc(fmtTime(c.hora))} h</td></tr>
      <tr><th>Registro de la atención</th><td>${esc(salida)} h</td></tr>
      ${c.puesto ? `<tr><th>Puesto</th><td>${esc(c.puesto)}</td></tr>` : ''}
    </table>
    <p class="pc-note">Este documento solo acredita la asistencia al servicio médico; no contiene información clínica.</p>
    <div class="pc-firmas"><div><span></span>${esc(c.atendio || 'Servicio Médico')}<small>Atendió</small></div><div><span></span>Jefe inmediato<small>Enterado</small></div></div>
    <p class="pc-foot">Emitida el ${esc(fmtDateTime(new Date().toISOString()))} h</p>`;
  document.body.appendChild(el);
  document.body.classList.add('printing');
  const limpiar = () => { document.body.classList.remove('printing'); el.remove(); window.removeEventListener('afterprint', limpiar); };
  window.addEventListener('afterprint', limpiar);
  setTimeout(() => window.print(), 50);
}

// ---------- Formulario de solicitud / reprogramación ----------
function defaultFecha() {
  const hoy = todayISO();
  if (isWeekday(hoy) && nowHHMM() < '17:00') return hoy;
  return stepWeekday(hoy, 1);
}

async function openCitaForm({ cita = null, fecha = null, hora = null, urgente = false } = {}) {
  const hoy = todayISO();
  const editing = !!cita;
  if (editing && !cita.colaborador) {
    // La fila puede venir incompleta (p. ej. desde el detalle): recargar
    const { data, error } = await sb.from('v_citas_med').select('*').eq('id', cita.id).single();
    if (error) { toast(errMsg(error), 'error'); return false; }
    cita = data;
  }
  const f0 = editing ? cita.fecha : (fecha || defaultFecha());
  const h0 = editing ? fmtTime(cita.hora) : hora;
  const body = `
    ${editing ? '' : `<label class="switch-row urg-switch" for="cf-urg"><span><b>${icon('siren')} Cita de urgencia / extraordinaria</b><br>
      <small class="hint" style="margin:0">Úsala si no hay horario disponible o no puede esperar. Servicio Médico recibe el aviso de inmediato y asigna un horario especial o la rechaza.</small></span>
      <input type="checkbox" id="cf-urg" name="urgente" ${urgente ? 'checked' : ''}></label>`}
    <div class="field">
      <label for="cf-col-search">Colaborador <span class="req">*</span></label>
      ${editing
        ? `<div class="chip-selected"><div><b>${esc(cita.colaborador)}</b><br><span>${esc([cita.num_empleado, cita.area].filter(Boolean).join(' · '))}</span></div></div>`
        : `<div id="cf-col"></div>`}
      <input type="hidden" name="colaborador_id" value="${editing ? esc(cita.colaborador_id) : ''}" ${editing ? '' : 'required'}>
      ${!editing && !state.isAdmin ? '<small class="hint">Puedes solicitar la cita para ti o para un colaborador de tu misma área.</small>' : ''}
    </div>
    <div class="form-grid">
      <div class="field"><label for="cf-fecha">Fecha <span class="req">*</span></label>
        <input type="date" id="cf-fecha" name="fecha" required min="${hoy}" value="${esc(f0)}"></div>
      <div class="field"><label for="cf-motivo">Motivo <span class="req">*</span></label>
        <select id="cf-motivo" name="motivo" required>
          <option value="">Selecciona…</option>
          ${Object.entries(MOTIVOS).map(([k, v]) => `<option value="${k}" ${editing && cita.motivo === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select></div>
    </div>
    <div class="field" id="cf-horario">
      <label>Horario <span class="req">*</span></label>
      <div id="cf-slots" class="slots" ${state.isMedico ? '' : 'role="radiogroup" aria-label="Horarios disponibles"'}></div>
      <small class="hint">${state.isMedico
        ? 'Como Servicio Médico puedes escribir la hora que quieras, aunque no coincida con los bloques de la agenda.'
        : 'Lunes a viernes de 9:00 a 17:30, bloques de 20 minutos. Los horarios tachados no están disponibles.'}</small>
    </div>
    ${state.isMedico && !editing ? `<div class="field hidden" id="cf-hora-esp"><label for="cf-hora-urg">Horario especial (opcional)</label>
      <input type="time" id="cf-hora-urg" name="hora_urg" step="60"><small class="hint">Si lo dejas vacío, podrás asignarlo después.</small></div>` : ''}
    <div class="notice warn hidden" id="cf-urg-nota">${icon('siren')}<span>La solicitud llegará como <b>urgente</b> a Servicio Médico, que te avisará el horario asignado o si la rechaza.</span></div>
    ${editing ? '' : `<div class="field hidden" id="cf-desc-f">
      <label for="cf-desc">Motivo de la urgencia <span class="req">*</span></label>
      <textarea id="cf-desc" name="descripcion" maxlength="300" data-counter placeholder="Ej. dolor intenso, herida que requiere curación"></textarea>
      <small class="hint">No incluyas diagnósticos ni información clínica sensible. Servicio Médico registrará lo necesario durante la atención.</small>
    </div>`}`;

  let slotToken = 0;
  return openModal({
    title: editing ? `Reprogramar cita ${cita.folio_txt || ''}` : (state.isAdmin ? 'Nueva cita' : 'Solicitar cita'),
    subtitle: editing ? 'Cambia la fecha, el horario o el motivo.' : 'La cita quedará pendiente hasta que Servicio Médico la confirme.',
    submitText: editing ? 'Guardar cambios' : 'Agendar cita',
    body,
    onOpen: ({ form }) => {
      bindCounters(form);
      if (!editing) {
        const picker = colaboradorPicker(form.querySelector('#cf-col'), form.elements.colaborador_id);
        // Quien solicita (usuario o administrador) aparece de inicio; se puede cambiar
        sb.from('colaboradores_med').select('id, nombre, num_empleado, usuario_id, area:areas_med(nombre)')
          .eq('usuario_id', state.profile.id).eq('activo', true).maybeSingle()
          .then(({ data }) => { if (data && !form.elements.colaborador_id.value) picker.select(data); });
      }
      const loadSlots = async (keep) => {
        const t = ++slotToken;
        const cont = form.querySelector('#cf-slots');
        const fecha = form.elements.fecha.value;
        const prev = keep || form.querySelector('input[name="hora"]:checked, input[name="hora"][type="time"]')?.value;
        if (form.elements.urgente?.checked) { cont.innerHTML = ''; return; }
        if (!fecha) { cont.innerHTML = '<span class="hint">Selecciona una fecha.</span>'; return; }
        if (!isWeekday(fecha)) { cont.innerHTML = '<span class="hint" style="color:var(--bad)">Sin servicio en fin de semana. Elige un día de lunes a viernes.</span>'; return; }
        if (fecha < hoy) { cont.innerHTML = '<span class="hint" style="color:var(--bad)">La fecha no puede ser pasada.</span>'; return; }
        cont.innerHTML = '<div class="skeleton" style="height:38px;grid-column:1/-1"></div>';
        let data, bloqueos;
        try {
          const [r, b] = await Promise.all([sb.rpc('med_horarios_ocupados', { p_fecha: fecha }), getBloqueos(fecha)]);
          data = must(r).data; bloqueos = b;
        } catch (error) {
          if (t === slotToken) cont.innerHTML = `<span class="hint" style="color:var(--bad)">${esc(errMsg(error))}</span>`;
          return;
        }
        if (t !== slotToken) return;
        const dia = bloqueoDe(bloqueos, fecha);
        if (state.isMedico) {
          // El médico escribe la hora libremente; solo se le informa lo que ya está ocupado
          const horas = [...new Set((data || []).map(fmtTime))].filter((h) => !(editing && fecha === cita.fecha && h === fmtTime(cita.hora)));
          cont.innerHTML = `<div class="hora-libre" style="grid-column:1/-1">
              <input type="time" id="cf-hora" name="hora" required step="60" value="${esc(prev || '')}" aria-label="Hora de la cita">
              <span class="hint" style="margin:0">${horas.length ? `Ya ocupadas ese día: ${esc(horas.join(', '))}.` : 'No hay otras citas ese día.'}</span></div>
            ${bloqueos.length ? `<span class="hint" style="grid-column:1/-1;color:var(--warn)">Marcado sin servicio: ${bloqueos.map((b) => `${esc(bloqueoTxt(b))} (${esc(b.motivo)})`).join(', ')}.</span>` : ''}`;
          return;
        }
        if (dia) { cont.innerHTML = `<span class="hint" style="color:var(--bad)">Sin servicio ese día: ${esc(dia.motivo)}. Elige otra fecha o usa Cita de urgencia.</span>`; return; }
        const ocup = new Set((data || []).map((h) => slotDe(fmtTime(h))));
        const now = nowHHMM();
        const own = editing && fecha === cita.fecha ? slotDe(fmtTime(cita.hora)) : null;
        cont.innerHTML = SLOTS.map((s) => {
          const past = fecha === hoy && s <= now && !state.isMedico;
          const bloq = bloqueoDe(bloqueos, fecha, s);
          const dis = (ocup.has(s) && s !== own) || past || !!bloq;
          return `<label class="slot" ${bloq ? `title="Sin servicio: ${esc(bloq.motivo)}"` : ''}><input type="radio" name="hora" value="${s}" required ${dis ? 'disabled' : ''} ${!dis && s === prev ? 'checked' : ''}><span>${s}</span></label>`;
        }).join('');
        if (bloqueos.length) cont.insertAdjacentHTML('beforeend', `<span class="hint" style="grid-column:1/-1">Sin servicio de ${bloqueos.map((b) => `${esc(bloqueoTxt(b))} (${esc(b.motivo)})`).join(', ')}.</span>`);
        if (!cont.querySelector('input:not(:disabled)')) cont.insertAdjacentHTML('beforeend', '<span class="hint" style="grid-column:1/-1;color:var(--bad)">No hay horarios disponibles este día.</span>');
      };
      form.elements.fecha.addEventListener('change', () => loadSlots());
      form._loadSlots = loadSlots;
      // Modo urgencia: sin bloques; el motivo de la urgencia es obligatorio
      const setUrg = () => {
        const urg = !!form.elements.urgente?.checked;
        form.querySelector('#cf-horario').classList.toggle('hidden', urg);
        form.querySelector('#cf-hora-esp')?.classList.toggle('hidden', !urg);
        form.querySelector('#cf-urg-nota').classList.toggle('hidden', !urg);
        if (form.elements.descripcion) { form.elements.descripcion.required = urg; form.querySelector('#cf-desc-f').classList.toggle('hidden', !urg); }
        if (urg && !form.elements.fecha.value) form.elements.fecha.value = hoy;
        loadSlots(h0);
      };
      form.elements.urgente?.addEventListener('change', setUrg);
      setUrg();
    },
    onSubmit: async ({ form, setError }) => {
      const urg = !!form.elements.urgente?.checked;
      if (!checkForm(form, {
        fecha: (v) => (!urg && !isWeekday(v) ? 'Solo de lunes a viernes (para otro día usa Cita de urgencia).' : v < hoy ? 'La fecha no puede ser pasada.' : ''),
        colaborador_id: (v) => (!v ? 'Selecciona un colaborador de la lista.' : ''),
      })) return false;
      const v = formValues(form);
      if (urg) {
        const { data } = must(await sb.from('citas_med').insert({
          colaborador_id: v.colaborador_id, fecha: v.fecha, motivo: v.motivo, descripcion: v.descripcion,
          tipo: 'urgente', hora: state.isMedico && v.hora_urg ? v.hora_urg : null,
        }).select('id, folio').single());
        avisar('nueva_cita', data.id);
        toast(`Solicitud urgente CM-${String(data.folio).padStart(5, '0')} enviada a Servicio Médico.`, 'success', 6000);
        return true;
      }
      if (!v.hora) { setError(state.isMedico ? 'Escribe la hora de la cita.' : 'Selecciona un horario disponible o marca Cita de urgencia.'); return false; }
      // Citas normales: sin descripción (al editar se conserva la que tuviera)
      const payload = { fecha: v.fecha, hora: v.hora, motivo: v.motivo };
      try {
        if (editing) {
          must(await sb.from('citas_med').update(payload).eq('id', cita.id).select('id').single());
          if (payload.fecha !== cita.fecha || payload.hora !== fmtTime(cita.hora)) avisar('reprogramada', cita.id);
          toast('Cita actualizada.', 'success');
        } else {
          const { data } = must(await sb.from('citas_med').insert({ ...payload, colaborador_id: v.colaborador_id }).select('id, folio').single());
          avisar('nueva_cita', data.id);
          toast(`Cita CM-${String(data.folio).padStart(5, '0')} registrada para el ${fmtDate(v.fecha)} a las ${v.hora} h.`, 'success', 6000);
        }
      } catch (err) {
        if (err.code === '23505' || /bloque_uk/.test(err.message || '')) {
          setError(state.isMedico ? 'Ya hay otra cita exactamente a esa hora. Escribe otra hora.' : 'Ese horario acaba de ocuparse. Elige otro.');
          await form._loadSlots();
          return false;
        }
        throw err;
      }
    },
  });
}

// Selector de colaborador con búsqueda en servidor
function colaboradorPicker(container, hidden) {
  container.innerHTML = `<div class="combo">
      <input type="text" id="cf-col-search" autocomplete="off" placeholder="Busca por nombre o No. de empleado" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <div class="combo-list hidden" role="listbox"></div></div>`;
  const input = container.querySelector('input');
  const list = container.querySelector('.combo-list');
  let results = [], hl = -1, tok = 0;

  const select = (c) => {
    hidden.value = c.id;
    hidden.dispatchEvent(new Event('input', { bubbles: true }));
    const fld = hidden.closest('.field');
    fld.classList.remove('invalid');
    fld.querySelectorAll('.field-error').forEach((x) => x.remove());
    container.innerHTML = `<div class="chip-selected"><div><b>${esc(c.nombre)}</b><br><span>${esc([c.num_empleado, c.area?.nombre].filter(Boolean).join(' · '))}</span></div>
      <button type="button" class="btn ghost" data-change>${icon('repeat')} Cambiar</button></div>`;
    refreshIcons();
    container.querySelector('[data-change]').addEventListener('click', () => { hidden.value = ''; colaboradorPicker(container, hidden); container.querySelector('input').focus(); });
  };
  const draw = (q) => {
    list.innerHTML = results.map((c, i) => `<button type="button" role="option" data-i="${i}" class="${i === hl ? 'hl' : ''}">
        <b>${esc(c.nombre)}</b>${c.usuario_id && c.usuario_id === state.profile.id ? ' (tú)' : ''}<br><span class="muted">${esc([c.num_empleado, c.area?.nombre].filter(Boolean).join(' · '))}</span></button>`).join('')
      + (results.length ? '' : `<div class="muted" style="padding:9px 10px">${q ? 'Sin coincidencias.' : 'Escribe para buscar.'}</div>`)
      + `<button type="button" class="combo-new" data-new>${icon('user-plus')} Registrar nuevo colaborador${q ? `: “${esc(q)}”` : ''}</button>`;
    list.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true');
    refreshIcons();
  };
  const search = debounce(async () => {
    const t = ++tok; const q = sanitizeSearch(input.value);
    let qb = sb.from('colaboradores_med').select('id, nombre, num_empleado, usuario_id, area:areas_med(nombre)').eq('activo', true).order('nombre').limit(8);
    // Sin importar acentos ni mayúsculas, y cada palabra en cualquier orden ("julian" encuentra "Julián")
    const palabras = q.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().split(' ').filter(Boolean);
    for (const w of palabras) qb = qb.ilike('nombre_norm', `%${w}%`);
    // Usuarios: solo para sí mismos o para colaboradores de su área (también se valida en la base de datos)
    if (!state.isAdmin) {
      const { id, area_id: area } = state.profile;
      qb = area ? qb.or(`area_id.eq.${area},usuario_id.eq.${id}`) : qb.eq('usuario_id', id);
    }
    const { data, error } = await qb;
    if (t !== tok) return;
    results = error ? [] : data; hl = results.length ? 0 : -1;
    draw(input.value.trim());
  }, 220);
  input.addEventListener('input', search);
  input.addEventListener('focus', search);
  input.addEventListener('keydown', (e) => {
    if (list.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(results.length - 1, hl + 1); draw(input.value.trim()); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(0, hl - 1); draw(input.value.trim()); }
    else if (e.key === 'Enter') { e.preventDefault(); if (results[hl]) select(results[hl]); }
    else if (e.key === 'Escape') { e.stopPropagation(); list.classList.add('hidden'); }
  });
  list.addEventListener('mousedown', (e) => e.preventDefault());
  list.addEventListener('click', async (e) => {
    const opt = e.target.closest('[data-i]');
    if (opt) { select(results[Number(opt.dataset.i)]); return; }
    if (e.target.closest('[data-new]')) {
      list.classList.add('hidden');
      const nuevo = await openColaboradorForm({ nombre: input.value.trim(), areaId: state.isAdmin ? '' : state.profile.area_id || '' });
      if (nuevo && nuevo.id) select(nuevo);
    }
  });
  input.addEventListener('blur', () => setTimeout(() => { list.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); }, 150));
  return { select };
}

      ${box('Fecha', esc(fmtLongDate(c.fecha)))}
      ${box('Horario', `${horaTxt(c)}${c.tipo === 'urgente' ? ` ${pill('Urgente', 'bad')}` : ''}`)}
      ${box('Colaborador', `${esc(c.colaborador)}<div class="cell-sub">${esc([c.num_empleado, c.area].filter(Boolean).join(' · '))}</div>`)}
      ${box('Motivo', esc(MOTIVOS[c.motivo] || c.motivo))}
      ${c.descripcion ? box('Descripción', esc(c.descripcion), true) : ''}
      ${box('Solicitó', `${esc(c.solicitante)}<div class="cell-sub">${fmtDateTime(c.created_at)}</div>`)}
      ${box('Última actualización', fmtDateTime(c.updated_at))}
      ${c.estado === 'cancelada' ? box('Cancelación', `${esc(c.motivo_cancelacion || '')}<div class="cell-sub">Por ${esc(c.cancelado_por_nombre || '—')}</div>`, true) : ''}
    </div>
    ${state.isMedico && c.estado === 'atendida' ? `
      <div class="section-title">${icon('stethoscope')} Atención</div>
      <div class="detail-grid">
        ${box('Padecimiento', esc(at?.padecimiento?.nombre || 'Sin clasificar'), true)}
        ${box('Sintomatología', esc(at?.sintomatologia || 'Sin registro'), true)}
        ${box('Nota de atención', esc(at?.nota || 'Sin registro'), true)}
        ${box('Atendió', `${esc(at?.atendido?.nombre || '—')}<div class="cell-sub">${fmtDateTime(at?.atendido_at)}</div>`, true)}
      </div>
      <div class="section-title">${icon('pill')} Medicamentos e insumos entregados</div>
      ${meds.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Medicamento</th><th>Lote</th><th>Caducidad</th><th class="num">Cantidad</th></tr></thead><tbody>
        ${meds.map((m) => `<tr><td>${esc(m.medicamento)}</td><td class="mono">${esc(m.lote)}</td><td>${fmtDate(m.caducidad)}</td><td class="num">${esc(m.tipo === 'uso' ? m.motivo : cantUnidad(-m.cantidad, m.unidad))}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="hint">No se entregaron medicamentos.</p>'}` : ''}
    ${acts.length ? `<div class="section-title">Acciones</div><div class="page-actions">
      ${acts.map(([a, ic, t, cls]) => `<button type="button" class="btn ${cls === 'fill-ok' ? 'btn-confirmar' : cls === 'fill-red' ? 'btn-noasistio' : a === 'atender' ? 'primary' : 'secondary'}" data-detail-act="${a}">${icon(ic)} ${esc(t)}</button>`).join('')}
    </div>` : ''}`;

  const choice = await openModal({
    title: `Cita ${c.folio_txt}`, subtitle: `${c.colaborador} · ${fmtDate(c.fecha)} · ${horaTxt(c)}`, size: 'lg', body,

// ---------- Atención con dispensación de medicamentos ----------
async function openAtender(c) {
  let meds, padecimientos;
  try {
    if (!c.colaborador) c = must(await sb.from('v_citas_med').select('*').eq('id', c.id).single()).data;
    // Medicamentos e insumos con existencia (el equipo no se entrega en consulta)
    meds = must(await sb.from('v_stock_med').select('id, clave, nombre, unidad, existencia_vigente, empaque, contenido_empaque, categoria, control, nivel_abierto')
      .eq('activo', true).neq('categoria', 'equipo').gt('existencia_vigente', 0).order('categoria').order('nombre')).data;
    padecimientos = must(await sb.from('padecimientos_med').select('id, nombre').eq('activo', true).order('nombre')).data;
  } catch (err) { toast(errMsg(err), 'error'); return false; }
  const hoy = todayISO();
  let rowSeq = 0;
  const lotesCache = new Map();

  const body = `
    <div class="notice">${icon('shield-check')}<span>Registra solo la información mínima necesaria (síntomas y nota breve). No captures diagnósticos detallados, antecedentes ni datos de terceros. Solo los administradores pueden consultar esta información.</span></div>
    <div class="detail-grid">
      <div class="info-box"><small>Colaborador</small><b>${esc(c.colaborador)}</b></div>
      <div class="info-box"><small>Cita</small><b>${esc(c.folio_txt)} · ${fmtDate(c.fecha)} ${esc(horaTxt(c))} · ${esc(MOTIVOS[c.motivo] || '')}</b></div>
    </div>
    <div class="field"><label for="at-pad">Padecimiento atendido <span class="req">*</span></label>
      <select id="at-pad" name="padecimiento" required><option value="">Selecciona…</option>
        ${padecimientos.map((p) => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}
        <option value="__otro">Otro (escribir)…</option></select>
      <div class="hidden" id="at-pad-otro" style="margin-top:8px"><input name="padecimiento_otro" maxlength="80" autocomplete="off" placeholder="Escribe el padecimiento">
        <small class="hint">Se agregará a la lista para las siguientes consultas.</small></div>
      <small class="hint">Se usa para las estadísticas por padecimiento y departamento. El catálogo se edita en Usuarios → Configuración.</small></div>
    <div class="field"><label for="at-sint">Sintomatología referida</label>
      <textarea id="at-sint" name="sintomatologia" maxlength="500" data-counter placeholder="Ej. cefalea leve desde la mañana"></textarea></div>
    <div class="field"><label for="at-nota">Nota de atención</label>
      <textarea id="at-nota" name="nota" maxlength="1000" data-counter placeholder="Indicaciones generales brindadas"></textarea></div>
    <fieldset><legend>Medicamentos e insumos utilizados</legend>
      <div class="med-rows" id="at-rows"></div>
      ${meds.length
        ? `<button type="button" class="btn teal" id="at-add" style="margin-top:10px">${icon('plus')} Agregar medicamento o insumo</button>
           <small class="hint">Se propone el lote con caducidad más próxima (primero en caducar, primero en salir). Los lotes caducados no se pueden entregar. En geles, cremas, frascos y rollos marca cuánto queda del envase; si se terminó, se descuenta.</small>`
        : '<p class="hint" style="margin:4px 0">No hay medicamentos ni insumos con existencia vigente. Puedes registrar la atención sin entrega.</p>'}
    </fieldset>`;

  const addRow = (form) => {
    const i = rowSeq++;
    const div = document.createElement('div');
    div.className = 'med-row'; div.dataset.row = i;
    div.innerHTML = `
      <div class="field f-med"><label for="m-${i}">Medicamento o insumo <span class="req">*</span></label>
        <select id="m-${i}" name="med_${i}" required><option value="">Selecciona…</option>
        ${meds.map((m) => `<option value="${esc(m.id)}">${esc(m.nombre)} (${esc(cantUnidad(m.existencia_vigente, m.unidad))}${m.categoria === 'insumo' ? ' · insumo' : ''})</option>`).join('')}</select></div>
      <div class="field"><label for="l-${i}">Lote <span class="req">*</span></label>
        <select id="l-${i}" name="lote_${i}" required disabled><option value="">—</option></select></div>
      <div class="field" data-qty><label for="q-${i}">Cantidad <span class="req">*</span></label>
        <input id="q-${i}" name="cant_${i}" type="number" inputmode="numeric" min="1" step="1" required value="1">
        <small class="hint" id="qu-${i}"></small></div>
      <div class="field full hidden" data-nivel><label>¿Cuánto queda del envase? <span class="req">*</span></label>${nivelesHTML(`niv_${i}`)}</div>
      <button type="button" class="icon-btn bad" data-remove aria-label="Quitar renglón" style="margin-bottom:4px">${icon('trash-2')}</button>`;
    form.querySelector('#at-rows').appendChild(div);
    div.querySelectorAll('[data-nivel] input').forEach((r) => { r.disabled = true; });
    refreshIcons();
    const medSel = div.querySelector(`#m-${i}`), loteSel = div.querySelector(`#l-${i}`), qty = div.querySelector(`#q-${i}`);
    medSel.addEventListener('change', async () => {
      loteSel.disabled = true; loteSel.innerHTML = '<option value="">Cargando…</option>';
      if (!medSel.value) { loteSel.innerHTML = '<option value="">—</option>'; return; }
      try {
        if (!lotesCache.has(medSel.value)) {
          const { data } = must(await sb.from('v_lotes_med').select('id, lote, caducidad, existencia, nivel')
            .eq('medicamento_id', medSel.value).gt('existencia', 0).or(`caducidad.is.null,caducidad.gte.${hoy}`)
            .order('caducidad', { nullsFirst: false }));
          lotesCache.set(medSel.value, data);
        }
        const lotes = lotesCache.get(medSel.value);
        const med = meds.find((x) => x.id === medSel.value);
        // Por envase: en lugar de cantidad se indica cuánto queda del envase
        const env = med?.control === 'envase';
        div.querySelector('[data-qty]').classList.toggle('hidden', env);
        qty.disabled = env;
        div.querySelector('[data-nivel]').classList.toggle('hidden', !env);
        div.querySelectorAll(`input[name="niv_${i}"]`).forEach((r) => { r.disabled = !env; });
        div.querySelector(`#qu-${i}`).textContent = med ? `En ${plural(med.unidad, 2)} (pieza por pieza)` : '';
        loteSel.innerHTML = lotes.map((l) => `<option value="${esc(l.id)}" data-max="${l.existencia}">${esc(l.lote)} · ${l.caducidad ? `cad. ${fmtDate(l.caducidad)}` : 'sin caducidad'} · ${esc(cantUnidad(l.existencia, med?.unidad || 'unidad'))} disp.${env && l.nivel ? ` (abierto, queda ${({ 100: "lleno", 75: "¾", 50: "½", 25: "¼" })[l.nivel]})` : ''}</option>`).join('')
          || '<option value="">Sin lotes vigentes</option>';
        loteSel.disabled = !lotes.length;
        loteSel.dispatchEvent(new Event('change'));
      } catch (err) { loteSel.innerHTML = '<option value="">Error al cargar</option>'; toast(errMsg(err), 'error'); }
    });
    loteSel.addEventListener('change', () => { const max = loteSel.selectedOptions[0]?.dataset.max; if (max) qty.max = max; });
    div.querySelector('[data-remove]').addEventListener('click', () => div.remove());
  };

  return openModal({
    title: 'Registrar atención', subtitle: 'Al guardar, la cita quedará como atendida y se descontarán los medicamentos.',
    size: 'lg', submitText: 'Registrar atención', body,
    onOpen: ({ form }) => {
      bindCounters(form);
      form.querySelector('#at-add')?.addEventListener('click', () => addRow(form));
      // Padecimiento fuera de la lista: "Otro" permite escribirlo
      form.elements.padecimiento.addEventListener('change', () => {
        const otro = form.elements.padecimiento.value === '__otro';
        form.querySelector('#at-pad-otro').classList.toggle('hidden', !otro);
        form.elements.padecimiento_otro.required = otro;
        if (otro) form.elements.padecimiento_otro.focus();
      });
    },
    onSubmit: async ({ form, setError }) => {
      if (!checkForm(form)) return false;
      const items = [];

  switch (p) {

async function libresDe(fecha, soloFuturos, bloqueos) {
  const { data, error } = await sb.rpc('med_horarios_ocupados', { p_fecha: fecha });
  if (error) throw error;
  const oc = new Set((data || []).map((h) => slotDe(fmtTime(h))));
  const now = nowHHMM();
  return SLOTS.filter((s) => !oc.has(s) && (!soloFuturos || s > now) && !bloqueoDe(bloqueos, fecha, s));
}

  return d;
}

  const sig = sigHabil(hoy, bloqueos);
  const diaBloq = isWeekday(hoy) ? bloqueoDe(bloqueos, hoy) : null;
  if (isWeekday(hoy) && !diaBloq && restantes > 0) {
    const libres = await libresDe(hoy, true, bloqueos);
    if (libres.length) return { tipo: 'hoy', fecha: hoy, libres, base: restantes };
    return { tipo: 'lleno', fecha: sig, libres: await libresDe(sig, false, bloqueos), base: SLOTS.length, finde: false };

}

function generarPassword() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz', num = '23456789', sym = '#$%*+-?';
  const pick = (s) => s[crypto.getRandomValues(new Uint32Array(1))[0] % s.length];
  const chars = [pick(abc.slice(0, 24)), pick(abc.slice(24)), pick(num), pick(sym)];
  while (chars.length < 12) chars.push(pick(abc + num));
  for (let i = chars.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
  return chars.join('');
}

// Galería de la carpeta "avatares" (fotos ya cargadas en Supabase Storage)
async function elegirFotoExistente() {
  const { data, error } = await sb.storage.from('avatares').list('', { limit: 500, sortBy: { column: 'name', order: 'asc' } });
  if (error) { toast(errMsg(error), 'error'); return null; }
  const fotos = (data || []).filter((f) => /\.(png|jpe?g|webp)$/i.test(f.name));
  if (!fotos.length) { toast('No hay fotos en la carpeta "avatares".', 'warning'); return null; }
  const url = (n) => sb.storage.from('avatares').getPublicUrl(n).data.publicUrl;
  const r = await openModal({
    title: 'Fotos existentes', subtitle: 'Carpeta “avatares” de Supabase Storage. Toca una foto para usarla.', size: 'lg', confirmDiscard: false,
    body: `<div class="toolbar"><div class="search">${icon('search')}<input type="search" id="gal-q" placeholder="Filtrar por nombre" aria-label="Filtrar fotos"></div></div>
      <div class="photo-gallery" id="gal">${fotos.map((f) => `<button type="button" data-url="${esc(url(f.name))}" data-n="${esc(f.name.toLowerCase())}">

    onOpen: ({ wrap, close }) => {
      wrap.querySelector('#gal').addEventListener('click', (e) => { const b = e.target.closest('[data-url]'); if (b) close(b.dataset.url); });

  });

}

// ---------------- Navegación ----------------
function allowed(name) { const r = ROUTES[name]; return r && r.roles.includes(state.isAdmin ? 'admin' : 'usuario'); }
function label(r) { return !state.isAdmin && r.labelUser ? r.labelUser : r.label; }

function buildNav() {
  const items = Object.entries(ROUTES).filter(([k]) => allowed(k));

  $('#mobile-nav').innerHTML = items.filter(([, r]) => r.mobile).slice(0, 5)
    .map(([k, r]) => `<a href="#/${k}" data-route="${k}">${icon(r.icon)}<span>${esc(label(r))}</span></a>`).join('');
  refreshIcons();
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return { name: path || 'panel', params: Object.fromEntries(new URLSearchParams(qs || '')) };
}

let pendingRoute = false;
async function route() {
  if (!state.profile) return;
  if (routing) { pendingRoute = true; return; }
  routing = true;
  try {
    let { name, params } = parseHash();
    if (!allowed(name)) {
      if (ROUTES[name]) toast('No tiene permiso para acceder a esa sección.', 'warning');
      name = 'panel'; params = {};
      history.replaceState(null, '', '#/panel');

    current?.mod?.destroy?.();
    destroyCharts();
    const r = ROUTES[name];
    current = r;
    document.querySelectorAll('[data-route]').forEach((a) => {

      a.classList.toggle('active', on);

    closeMenu();

    view.innerHTML = '';

    refreshIcons();

    console.error(err);

      case 'forgot': await forgotPassword(); break;

// Menú lateral: siempre oculto; se despliega con el botón y se cierra al elegir una vista

// Fecha completa (lunes 12 de octubre de 2026) y hora con segundos, hora de Ciudad de México
function startClock() {
  const dEl = $('#clock-date'), tEl = $('#clock-time');
  const parts = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const time = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const tick = () => {
    const now = new Date();
    const p = Object.fromEntries(parts.formatToParts(now).map((x) => [x.type, x.value]));
    const wd = p.weekday.charAt(0).toUpperCase() + p.weekday.slice(1);
    dEl.textContent = `${wd} ${p.day} de ${p.month} del ${p.year}`;
    tEl.textContent = time.format(now);
  };
  tick(); setInterval(tick, 1000);
}

  else { document.documentElement.removeAttribute('data-theme'); prefs.del('med.theme'); }

// ---------------- Autenticación ----------------
async function login(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const msg = $('#login-msg');
  msg.className = 'login-msg hidden';
  if (!checkForm(form, {
    email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo corporativo @petstable.mx.'),
  })) return;
  const btn = $('#login-submit');
  if (btn.disabled) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Verificando…';
  prefs.set('med.remember', $('#login-remember').checked ? '1' : '0');
  const { error } = await sb.auth.signInWithPassword({
    email: form.email.value.trim().toLowerCase(),
    password: form.password.value,
  });
  if (error) {
    btn.disabled = false; btn.innerHTML = `${icon('log-in')} Entrar`; refreshIcons();
    msg.className = 'login-msg error';
    msg.textContent = /invalid login credentials/i.test(error.message)
      ? 'Correo o contraseña incorrectos.'
      : /email not confirmed/i.test(error.message) ? 'Tu correo aún no está confirmado. Revisa tu bandeja de entrada.'
      : /rate limit|too many/i.test(error.message) ? 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'
      : errMsg(error);
    return;
  }
  form.password.value = '';
}

async function logout() {
  // Las notificaciones siguen activas en el dispositivo: la próxima cuenta que entre las recibe
  // scope "local": cierra solo esta sesión (otras apps de Pet's Table comparten la cuenta)
  await sb.auth.signOut({ scope: 'local' });
  state.profile = null; state.session = null;
  history.replaceState(null, '', location.pathname);
  showLogin();
  toast('Sesión cerrada.', 'success');
}

async function forgotPassword() {
  const email = $('#login-email').value.trim();
  await openModal({
    title: 'Restablecer contraseña',
    subtitle: 'Te enviaremos un enlace a tu correo corporativo.',
    size: 'sm', submitText: 'Enviar enlace', confirmDiscard: false,
    body: `<div class="field"><label for="fp-email">Correo corporativo <span class="req">*</span></label>
      <input id="fp-email" name="email" type="email" required maxlength="120" value="${esc(email)}" placeholder="nombre@petstable.mx"></div>
      <p class="hint">Esta contraseña es la misma de tu cuenta Pet's Table en las demás aplicaciones.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo @petstable.mx.') })) return false;
      const { error } = await sb.auth.resetPasswordForEmail(form.email.value.trim().toLowerCase(), { redirectTo: `${location.origin}/` });
      if (error) throw error;
      toast('Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.', 'success', 7000);
    },
  });
}

async function recoveryFlow() {
  hideSplash();
  $('#login').classList.remove('hidden');
  await openModal({
    title: 'Define tu nueva contraseña', size: 'sm', submitText: 'Guardar contraseña', confirmDiscard: false,
    body: `<div class="field"><label for="np1">Nueva contraseña <span class="req">*</span></label>
        <input id="np1" name="p1" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <div class="field"><label for="np2">Confirmar contraseña <span class="req">*</span></label>
        <input id="np2" name="p2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <p class="hint">Mínimo 8 caracteres. Combina letras, números y símbolos.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { p2: (v, f) => (v !== f.p1.value ? 'Las contraseñas no coinciden.' : '') })) return false;
      const { error } = await sb.auth.updateUser({ password: form.p1.value });
      if (error) throw error;
      toast('Contraseña actualizada.', 'success');
    },
  });
  history.replaceState(null, '', location.pathname);
  const { data } = await sb.auth.getSession();
  if (data.session) { state.session = data.session; await loadProfileAndStart(); } else showLogin();
}

// Si la sesión inicial no dispara eventos (p. ej. sin sesión guardada), mostrar login
setTimeout(async () => {
  if (!$('#splash').classList.contains('hidden')) {
    const { data } = await sb.auth.getSession();
    if (!data.session) showLogin();
  }
}, 2500);

Object.assign(__exp, { setTheme });

})();
